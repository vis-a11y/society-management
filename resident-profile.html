<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocietyHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="main-container">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-building"></i></div>
            <h1 class="logo-text">SocietyHub</h1>
        </div>
        <nav class="nav-menu">
            <a href="resident-dashboard.html" class="nav-item "><i class="fas fa-home"></i> <span>Dashboard</span></a><a href="resident-profile.html" class="nav-item active"><i class="fas fa-user"></i> <span>My Profile</span></a><a href="resident-maintenance.html" class="nav-item "><i class="fas fa-wallet"></i> <span>Maintenance</span></a><a href="resident-complaints.html" class="nav-item "><i class="fas fa-exclamation-circle"></i> <span>Complaints</span></a><a href="resident-notices.html" class="nav-item "><i class="fas fa-bullhorn"></i> <span>Notices</span></a><a href="resident-visitors.html" class="nav-item "><i class="fas fa-user-check"></i> <span>Visitors</span></a><a href="resident-events.html" class="nav-item "><i class="fas fa-calendar"></i> <span>Events</span></a><a href="resident-parking.html" class="nav-item "><i class="fas fa-car"></i> <span>Parking</span></a><a href="resident-documents.html" class="nav-item "><i class="fas fa-folder"></i> <span>Documents</span></a><a href="resident-messages.html" class="nav-item "><i class="fas fa-envelope"></i> <span>Messages</span></a>
        </nav>
        <div style="margin-top:auto; padding-top:1rem; border-top:1px solid var(--border);">
            <button class="nav-item btn-danger" onclick="logout()" style="color:var(--danger)">
                <i class="fas fa-sign-out-alt"></i> <span>Sign Out</span>
            </button>
        </div>
    </aside><main class="main-content">
        <div class="page-header"><div><h1>RESIDENT-PROFILE</h1></div></div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Resident Name</div>
                <div class="stat-value" id="profile-name">...</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Flat Number</div>
                <div class="stat-value" id="profile-flat">...</div>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><h3 class="card-title">Update Contact & Vehicle Details</h3></div>
            <div class="card-content">
                <form id="profileForm" onsubmit="event.preventDefault(); apiAction('users/profile', 'PUT', Object.fromEntries(new FormData(event.target)))">
                    <div class="grid-2">
                        <div class="form-group"><label>Phone Number</label><input type="text" id="phone-input" name="phone" class="form-control" placeholder="E.g., +91 9876543210" required></div>
                        <div class="form-group"><label>Vehicle Details (Optional)</label><input type="text" id="vehicle-input" name="vehicle_details" class="form-control" placeholder="E.g., MH-12-AB-1234 (Honda City)"></div>
                    </div>
                    <button class="btn btn-primary mt-2" type="submit">Update Profile Data</button>
                </form>
            </div>
        </div>
    </main></div>
<script src="app.js"></script>
</body>
</html>
