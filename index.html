<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocietyHub - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; background: var(--background);">

<div class="auth-container" style="width: 100%;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div class="logo-icon" style="margin: 0 auto 1rem;"><i class="fas fa-building"></i></div>
        <h2 style="font-size: 1.8rem; font-weight: 800;">SocietyHub</h2>
        <p class="muted">Enter portal details</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label>Login As</label>
            <select class="form-control" name="role" required>
                <option value="Resident">Resident</option>
                <option value="Admin">Management / Admin</option>
            </select>
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" class="form-control" name="name" placeholder="E.g., admin or user" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" name="password" placeholder="admin123 or user123" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
            Sign In <i class="fas fa-arrow-right"></i>
        </button>
    </form>
</div>

<script src="app.js"></script>
</body>
</html>
