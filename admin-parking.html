<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocietyHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="main-container">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-building"></i></div>
            <h1 class="logo-text">SocietyHub</h1>
        </div>
        <nav class="nav-menu">
            <a href="admin-dashboard.html" class="nav-item "><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a><a href="admin-residents.html" class="nav-item "><i class="fas fa-users"></i> <span>Residents</span></a><a href="admin-notices.html" class="nav-item "><i class="fas fa-bullhorn"></i> <span>Notices</span></a><a href="admin-visitors.html" class="nav-item "><i class="fas fa-id-card"></i> <span>Visitors</span></a><a href="admin-staff.html" class="nav-item "><i class="fas fa-user-tie"></i> <span>Staff</span></a><a href="admin-parking.html" class="nav-item active"><i class="fas fa-car"></i> <span>Parking</span></a><a href="admin-events.html" class="nav-item "><i class="fas fa-calendar"></i> <span>Events</span></a><a href="admin-maintenance.html" class="nav-item "><i class="fas fa-wallet"></i> <span>Maintenance</span></a><a href="admin-complaints.html" class="nav-item "><i class="fas fa-headset"></i> <span>Complaints</span></a><a href="admin-documents.html" class="nav-item "><i class="fas fa-folder"></i> <span>Documents</span></a><a href="admin-messages.html" class="nav-item "><i class="fas fa-envelope"></i> <span>Messages</span></a>
        </nav>
        <div style="margin-top:auto; padding-top:1rem; border-top:1px solid var(--border);">
            <button class="nav-item btn-danger" onclick="logout()" style="color:var(--danger)">
                <i class="fas fa-sign-out-alt"></i> <span>Sign Out</span>
            </button>
        </div>
    </aside><main class="main-content">
        <div class="page-header"><div><h1>ADMIN-PARKING</h1></div></div>
        <div class="card">
            <div class="card-header"><h3 class="card-title"><i class="fas fa-parking" style="margin-right:.75rem;color:var(--primary)"></i>Assign Parking Slot</h3></div>
            <div class="card-content">
                <form id="actionForm" onsubmit="handleForm(event, 'parking')">
                    <div class="grid-2">
                        <div class="form-group"><label>Resident ID</label><input type="number" name="resident_id" class="form-control" placeholder="Enter Resident's ID" required></div>
                        <div class="form-group"><label>Parking Slot Number</label><input type="text" name="parking_slot" class="form-control" placeholder="E.g., P-012 or B2-Slot-5" required></div>
                    </div>
                    <button class="btn btn-primary" type="submit"><i class="fas fa-check"></i> Assign Slot</button>
                </form>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><h3 class="card-title">Current Parking Allocations</h3></div>
            <div class="card-content"><div id="dataTable" class="activity-list"></div></div>
        </div>
    </main></div>
<script src="app.js"></script>
</body>
</html>
