<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Profile - SocietyHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-elegant);
            overflow: hidden;
        }

        .profile-header {
            background: var(--gradient-primary);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--primary);
            border: 4px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .profile-info {
            padding: 2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .info-item label {
            display: block;
            color: var(--muted-foreground);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .info-item span {
            font-weight: 600;
            color: var(--foreground);
            font-size: 1.1rem;
        }

        .profile-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            padding: 1.5rem 2rem;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-active { background: #dcfce7; color: #166534; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }

        @media (max-width: 640px) {
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon"><i class="fas fa-building"></i></div>
                    <h1 class="logo-text">SocietyHub</h1>
                </div>
            </div>
            <div class="header-right">
                <button onclick="window.history.back()" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Back</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <h2 id="residentName">Loading...</h2>
                <div id="residentStatus" class="badge"></div>
            </div>

            <div class="profile-info">
                <div class="info-grid">
                    <div class="info-item">
                        <label>Flat Number</label>
                        <span id="flatNumber">-</span>
                    </div>
                    <div class="info-item">
                        <label>Contact Number</label>
                        <span id="contactNumber">-</span>
                    </div>
                    <div class="info-item">
                        <label>Email Address</label>
                        <span id="emailAddress">-</span>
                    </div>
                    <div class="info-item">
                        <label>Joining Date</label>
                        <span id="joinDate">-</span>
                    </div>
                </div>

                <div class="card" style="background: #f1f5f9; border: none;">
                    <div class="card-header">
                        <h3>Quick History</h3>
                    </div>
                    <div class="card-content">
                        <p style="color: #64748b; font-size: 0.9rem;">No recent activities or issues recorded for this resident.</p>
                    </div>
                </div>
            </div>

            <div class="profile-actions">
                <button class="btn btn-ghost" id="editProfileBtn"><i class="fas fa-edit"></i> Edit Details</button>
                <button class="btn btn-primary" id="messageBtn"><i class="fas fa-envelope"></i> Send Message</button>
            </div>
        </div>
    </main>

    <!-- Edit Resident Modal -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" id="closeEdit">&times;</span>
            <h3 style="margin-bottom: 1.5rem;">Edit Resident Details</h3>
            <form id="editForm">
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; color: #64748b;">Resident Name</label>
                    <input type="text" id="editName" style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 6px;" required>
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; color: #64748b;">Flat Number</label>
                    <input type="text" id="editFlat" style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 6px;" required>
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; color: #64748b;">Contact Number</label>
                    <input type="text" id="editPhone" style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 6px;" required>
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
                    <label style="font-size: 0.8rem; color: #64748b;">Email Address</label>
                    <input type="email" id="editEmail" style="width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 6px;" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Modals use these shared styles -->
    <style>
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }
        .close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #94a3b8;
        }
    </style>

    <script src="toast.js"></script>
    <script src="resident_profile.js"></script>
</body>
</html>
