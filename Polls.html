<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polls & Surveys - SocietyHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .poll-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 2rem; }
        .poll-question { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: #1e293b; }
        .poll-option { display: block; width: 100%; text-align: left; padding: 1rem; margin-bottom: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
        .poll-option:hover:not(.voted) { border-color: var(--primary); background: #f1f5f9; }
        .poll-option.selected { border-color: var(--primary); background: #eff6ff; }
        .poll-option.voted { cursor: default; }
        .poll-progress { position: absolute; top: 0; left: 0; height: 100%; background: #dbeafe; z-index: 0; transition: width 0.5s ease-out; }
        .poll-content { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
        .poll-vote-count { font-size: 0.875rem; color: #64748b; font-weight: 600; }
        .poll-meta { display: flex; gap: 1rem; color: #94a3b8; font-size: 0.875rem; margin-top: 1rem; border-top: 1px solid #f1f5f9; padding-top: 1rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon"><i class="fas fa-building"></i></div>
                    <h1 class="logo-text">SocietyHub</h1>
                </div>
            </div>
            <div class="header-right">
                <button class="notification-btn"><i class="fas fa-bell"></i></button>
                <div class="user-avatar" title="Resident"></div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav class="nav-menu">
                <a href="index2.html" class="nav-item"><i class="fas fa-arrow-left"></i> <span>Dashboard</span></a>
                <button class="nav-item active"><i class="fas fa-square-poll-vertical"></i> <span>Polls</span></button>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div class="page-title">
                    <h1>Polls & Surveys</h1>
                    <p>Voice your opinion on society matters.</p>
                </div>
            </div>

            <div id="pollsList">
                <!-- Polls populated by JS -->
            </div>
        </main>
    </div>

    <script src="toast.js"></script>
    <script src="Polls.js"></script>
</body>
</html>
