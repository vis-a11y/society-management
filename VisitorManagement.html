<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Management - SocietyHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .visitor-form {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 2rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .visitor-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }
        .visitor-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .visitor-main { display: flex; gap: 1rem; align-items: center; }
        .visitor-icon { width: 48px; height: 48px; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 1.25rem; }
        .out-btn { background: #fee2e2; color: #991b1b; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.875rem; transition: background 0.2s; }
        .out-btn:hover { background: #fecaca; }
        .out-badge { background: #f1f5f9; color: #64748b; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 500; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon"><i class="fas fa-building"></i></div>
                    <h1 class="logo-text">SocietyHub</h1>
                </div>
            </div>
            <div class="header-right">
                <button class="notification-btn"><i class="fas fa-bell"></i></button>
                <div class="user-avatar" title="Gate Security"></div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav class="nav-menu">
                <a href="adminDashboard.html" class="nav-item"><i class="fas fa-arrow-left"></i> <span>Back to Admin</span></a>
                <button class="nav-item active"><i class="fas fa-id-card"></i> <span>Visitors List</span></button>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div class="page-title">
                    <h1>Visitor Management</h1>
                    <p>Track entries and exits of visitors in real-time.</p>
                </div>
            </div>

            <div class="visitor-form">
                <h3>Log New Entry</h3>
                <form id="visitorForm" style="margin-top: 1.5rem;">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Visitor Name</label>
                            <input type="text" id="vName" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="vPhone" required placeholder="9876543210">
                        </div>
                        <div class="form-group">
                            <label>Flat Number</label>
                            <input type="text" id="vFlat" required placeholder="A-101">
                        </div>
                        <div class="form-group">
                            <label>Purpose</label>
                            <input type="text" id="vPurpose" required placeholder="Delivery / Guest">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Log Entry</button>
                </form>
            </div>

            <div id="visitorList">
                <!-- Log entries populated by JS -->
            </div>
        </main>
    </div>

    <script src="toast.js"></script>
    <script src="VisitorManagement.js"></script>
</body>
</html>
