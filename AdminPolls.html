<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Polls - SocietyHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .poll-form { background: white; padding: 2rem; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 2rem; }
        .option-input-group { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .option-input-group input { flex: 1; }
        .remove-option { background: #fee2e2; color: #991b1b; border: none; padding: 0.5rem; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon"><i class="fas fa-building"></i></div>
                    <h1 class="logo-text">SocietyHub</h1>
                </div>
            </div>
            <div class="header-right">
                <div class="user-avatar" title="Admin"></div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav class="nav-menu">
                <a href="adminDashboard.html" class="nav-item"><i class="fas fa-arrow-left"></i> <span>Back to Admin</span></a>
                <button class="nav-item active"><i class="fas fa-square-poll-vertical"></i> <span>Manage Polls</span></button>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div class="page-title">
                    <h1>Manage Polls</h1>
                    <p>Create new polls for society residents.</p>
                </div>
            </div>

            <div class="poll-form">
                <h3>Create New Poll</h3>
                <form id="createPollForm" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label>Question</label>
                        <input type="text" id="pollQuestion" required placeholder="e.g. Should we renovate the clubhouse?">
                    </div>
                    <div class="form-group">
                        <label>Options</label>
                        <div id="optionsContainer">
                            <div class="option-input-group">
                                <input type="text" class="poll-opt" required placeholder="Option 1">
                            </div>
                            <div class="option-input-group">
                                <input type="text" class="poll-opt" required placeholder="Option 2">
                            </div>
                        </div>
                        <button type="button" class="btn btn-ghost mt-1" onclick="addOption()"><i class="fas fa-plus"></i> Add Option</button>
                    </div>
                    <div class="form-group">
                        <label>Expires At</label>
                        <input type="date" id="pollExpires" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Publish Poll</button>
                </form>
            </div>

            <div id="adminPollsList">
                <!-- List of existing polls with results -->
            </div>
        </main>
    </div>

    <script src="toast.js"></script>
    <script src="AdminPolls.js"></script>
</body>
</html>
